services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: servicehub
      POSTGRES_USER: servicehub
      POSTGRES_PASSWORD: secret
  php:
    build:
      #context: ..  - берёт корень проекта servicehub как build context.
      context: ..
      dockerfile: docker/php/Dockerfile
    # Переопределяем пользователя контейнера вашим локальным UID/GID.
    # PHP-FPM автоматически запустится от имени этого пользователя.
    #user: "${UID:-1000}:${GID:-1000}"
    # монтирует весь servicehub в PHP-контейнер.
    volumes:
      - ..:/var/www/html
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    volumes:
      - ..:/var/www/html
    depends_on:
      - php
  redis:
    image: redis:8-alpine
    #ports:
    #  - "6379:6379"
    #внутри Docker-сети Laravel сможет обращаться к Redis как redis:6379.